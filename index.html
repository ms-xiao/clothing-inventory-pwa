<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#224e45">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="衣记">
  <meta name="description" content="小店的每一件，都有记录。离线可用的本地服装进销存。">
  <title>衣记 · 小店进销存</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-180.png">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">跳到内容</a>
  <header class="app-header">
    <a class="brand" href="#inventory" aria-label="衣记首页"><span class="brand-mark" data-icon="hanger"></span><span>衣记<span class="brand-subtitle">小店进销存</span></span></a>
    <div class="offline-state" id="offline-status" role="status"><span class="status-dot"></span><span>正在准备离线…</span></div>
  </header>
  <nav class="navigation" aria-label="主导航">
    <button type="button" data-view="inventory" class="nav-item active" aria-current="page"><span data-icon="inventory"></span><span>库存</span></button>
    <button type="button" data-view="receive" class="nav-item"><span data-icon="receive"></span><span>进货</span></button>
    <button type="button" data-view="sell" class="nav-item"><span data-icon="sell"></span><span>销售</span></button>
    <button type="button" data-view="history" class="nav-item"><span data-icon="history"></span><span>记录</span></button>
    <button type="button" data-view="settings" class="nav-item"><span data-icon="settings"></span><span>设置</span></button>
  </nav>
  <div id="update-banner" class="update-banner" hidden>新版本已就绪 <button type="button" id="update-app">更新应用</button></div>
  <main id="main" tabindex="-1"><div class="loading-state">正在打开本地账本…</div></main>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="sheet" class="sheet" aria-labelledby="sheet-title"></dialog>
  <noscript>衣记需要 JavaScript 才能保存和管理本地库存，请在浏览器中启用 JavaScript。</noscript>
</body>
</html>
