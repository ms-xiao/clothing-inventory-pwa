<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#F2F2F7" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="衣记" />
    <meta
      name="description"
      content="小店的每一件，都有记录。离线可用的本地服装进销存。"
    />
    <title>衣记 · 小店进销存</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/icon-180.png" />
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./js/app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">跳到内容</a>
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#inventory" aria-label="衣记首页"
        ><span data-icon="shirt"></span>衣记</a
      >
      <nav class="navigation" aria-label="主导航" id="navigation">
        <button
          type="button"
          data-view="inventory"
          class="nav-item active"
          aria-current="page"
        >
          <span data-icon="inventory"></span><span>库存</span
          ><span id="sidebar-stock" class="nav-count"></span>
        </button>
        <button type="button" data-view="receive" class="nav-item">
          <span data-icon="receive"></span><span>进货</span>
        </button>
        <button type="button" data-view="sell" class="nav-item">
          <span data-icon="sell"></span><span>销售</span>
        </button>
        <button type="button" data-view="history" class="nav-item">
          <span data-icon="history"></span><span>记录</span>
        </button>
        <button type="button" data-view="settings" class="nav-item">
          <span data-icon="settings"></span><span>设置</span>
        </button>
      </nav>
      <div class="sidebar-foot">
        <p>本机账本</p>
        <div class="offline-state" id="offline-status" role="status">
          <span class="status-dot"></span><span>正在准备离线…</span>
        </div>
      </div>
    </aside>
    <header class="topbar">
      <button type="button" class="text-button" id="back-button" hidden>
        <span data-icon="back"></span>库存
      </button>
      <button
        type="button"
        class="icon-button sidebar-toggle"
        id="sidebar-toggle"
        aria-label="收起侧边栏"
        aria-expanded="true"
        aria-controls="sidebar"
      >
        <span data-icon="sidebar"></span>
      </button>
      <div class="topbar-actions">
        <button
          type="button"
          class="icon-button"
          data-action="add"
          aria-label="添加商品"
        >
          <span data-icon="plus"></span></button
        ><button
          type="button"
          class="icon-button menu-toggle"
          id="menu-toggle"
          aria-label="打开导航菜单"
          aria-expanded="false"
          aria-controls="navigation"
        >
          <span data-icon="more"></span>
        </button>
      </div>
    </header>
    <div id="update-banner" class="update-banner" hidden>
      新版本已就绪 <button type="button" id="update-app">更新应用</button>
    </div>
    <main id="main" tabindex="-1">
      <div class="loading-state">正在打开本地账本…</div>
    </main>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <dialog id="sheet" class="sheet" aria-labelledby="sheet-title"></dialog>
    <noscript
      >衣记需要 JavaScript 才能保存和管理本地库存，请在浏览器中启用
      JavaScript。</noscript
    >
  </body>
</html>
